name: Update Verse of the Day

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-votd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's verse from YouVersion
        env:
          YVP_APP_KEY: ${{ secrets.YVP_APP_KEY }}
        run: python3 scripts/fetch_votd.py

      - name: Commit updated verse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add votd.json
          git diff --staged --quiet || git commit -m "Update verse of the day"
          git push
